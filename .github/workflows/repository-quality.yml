name: Repository Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aegis_ios
          POSTGRES_USER: aegis_ios
          POSTGRES_PASSWORD: ci-local-only
        options: >-
          --health-cmd "pg_isready -U aegis_ios -d aegis_ios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate repository
        run: sh scripts/validate_repository.sh
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install implementation tooling
        run: pnpm install --frozen-lockfile
      - name: Validate migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://aegis_ios:ci-local-only@localhost:5432/aegis_ios
        run: |
          pnpm migration:apply
          pnpm migration:status
          pnpm i1:persistence:check
          pnpm i1:recovery:check
          pnpm i2:persistence:check
          pnpm i2:recovery:check
          pnpm i2:reconciliation:check
      - name: Validate implementation foundation
        run: pnpm check
      - name: Audit locked dependencies
        run: pnpm audit
